# Runtime support policy (ADR B). `required` is what a release must qualify
# on before it advertises the surface; `status` is the evidence today.
schema_version: 1
surfaces:
  claude-code:
    role:
    - development
    - runtime
    required: true
    status: tested
    evidence: >-
      Qualified for 0.8.2 by a headless run of the full matrix on Claude Code, recorded in
      .osp/qualification/ at that version. Not qualified for 0.9.0: the release environment could not
      produce a record that would be evidence, two runs of the same candidate disagreeing through a
      shared plugin cache and a denied shell tool, so the surface is waived for this release. The
      attested sea level budget was verified by hand from the installed 0.9.0 package and passes at
      the new script paths.
  claude-cowork:
    role: runtime
    required: true
    status: tested
    evidence: Marketplace install verified 2026-07-04 (what that asserts is docs/runtime-distribution.md
      in the marketplace repository); no per-release qualification yet
  openai-codex:
    role: runtime
    required: true
    status: planned
    evidence: The Agent Plugins projection (plugin.json, mcp.json) is rendered from package.yaml and passes
      osp.py plugin-check in the gate; Codex qualification of a release is the reference capability deliverable
      of osp-architecture-alignment and has not run
  claude-science:
    role: future-runtime
    required: false
    status: limited-release
qualification:
  require:
  - install
  - skill-discovery
  - skill-invocation
  - knowledge-resolution
  - dependency-resolution
  - golden-computation
  - prove
  - receipt
  - release-lock
probes:
  skill-invocation:
    skill: briefing-generator
    prompt: Write the regional sea level briefing for the US northeast coast over 2010, with the headline
      trend and what it means for the coast.
    # A briefing is judged on where its numbers come from, so the
    # expectation is the one computation this package lets a briefing quote
    # and the attester whose verdict has to clear before a number is
    # written. The skill names both where the gate opens and where it
    # refuses, and it names them whether or not a region and a period were
    # given, which is what makes the pair honest in the slash form the
    # harness sends with no arguments as well as in the conversational
    # form. The computation is matched by name rather than by its concept
    # path, and across the separators the skill uses, because a run names
    # it by concept path, by concept name, in prose and by the executor's
    # filename about as readily. The name keeps ECCO in it because a
    # briefing written from memory says regional sea level too, and that
    # briefing is the failure worth catching. The region the prompt binds
    # is not on the list: the slash form carries no arguments today, so no
    # bound value can be asked of it.
    expect:
    - ecco[ _-]regional[ _-]sea[ _-]level
    - attester
    criteria: The briefing is traced to the sanctioned regional partition computation and to the attester's
      verdict on its receipt, and no number is drafted without a PASS.
  prove:
    prompt: 'Run the capability''s attested sea level budget closure on its synthetic fixture and report
      the verdict and the residual trend it prints. The command is: uv run ${PLUGIN_ROOT}/verification/sea_level_budget.py
      --runtime ${RUNTIME} --out ${WORK}/receipt.json'
    receipt: ${WORK}/receipt.json
    command:
    - uv
    - run
    - ${PLUGIN_ROOT}/verification/sea_level_budget.py
    - --attest
    - ${WORK}/receipt.json
    - --out
    - ${WORK}/attestation.json
    attestation: ${WORK}/attestation.json
  golden-computation:
  - verification/sea_level_budget.py
