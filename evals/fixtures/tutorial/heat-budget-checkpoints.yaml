# Eval fixture: checkpoints lifted from the ECCO tutorial's heat budget
# closure chapter (kit 4, tutorial companion). The numbers a correct
# walkthrough produces, quoted, for tutorial-fidelity graders.
chapter: https://ecco-v4-python-tutorial.readthedocs.io/ECCO_v4_Heat_budget_closure.html
extracted: 2026-08-30
companion_concept: podaac/tutorial/ecco-heat-budget-tutorial-checkpoints.md (nasa-daac-knowledge)
checkpoints:
  residual_depth_time_sum_bound:
    value: 1.0e-12
    units: degC s-1
    scope: most grid points, global, residuals summed vertically and temporally
    quote: "Summing residuals vertically and temporally yields < 10^-12 C s^-1 for most grid points."
  residual_histogram_range:
    range: [0.0, 2.0e-12]
    units: degC s-1
    scope: the chapter's residual histogram axis
  geothermal_omission:
    effect: residual rises well above closure residual, by three orders of magnitude
    plot_scale: 1.0e-9
    units: degC s-1
    quote: "the contribution from geothermal flux in the heat budget is well above the residual (by three orders of magnitude)"
notes: >
  The tutorial bound is a global depth-and-time-summed statistic; the
  OSP pass bar (absolute pointwise, owned by the attested computation
  concept) is a different statistic of the same closure. Graders use
  this fixture for tutorial-fidelity checks, never as the OSP tolerance.
