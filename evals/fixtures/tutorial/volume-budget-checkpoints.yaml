# Eval fixture: checkpoints lifted from the ECCO tutorial's volume and
# sea level budget chapter (kit 4, tutorial companion). Quoted signals a
# correct walkthrough produces, for tutorial-fidelity graders.
chapter: https://ecco-v4-python-tutorial.readthedocs.io/ECCO_v4_Volume_budget_closure.html
extracted: 2026-08-30
companion_concept: podaac/tutorial/ecco-volume-budget-tutorial-checkpoints.md (nasa-daac-knowledge)
checkpoints:
  tendency_route_agreement:
    value: 1.0e-6
    units: m
    scope: the two routes to the time-mean ETAN tendency
    quote: "these are the same to within 10^-6 meters!"
  residual_bound:
    value: 1.0e-11
    units: m s-1
    scope: almost all grid points, ETAN budget residuals
    quote: "Almost all residuals < 10^-11 m/s."
  closure_terms:
    terms: [UVELMASS, VVELMASS, WVELMASS, oceFWflx]
    scope: the ETAN (sea level) budget identity, NOT the interior volume budget
notes: >
  Identity discipline: the chapter closes the ETAN sea-level budget,
  where oceFWflx is an explicit term; the bundle's interior volume
  budget closes on transport convergence alone (WVELMASS carries the
  surface freshwater flux there, and adding oceFWflx double-counts).
  Graders must not mix the two identities.
