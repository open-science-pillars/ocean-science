name: goldens
# The goldens under verification/, each named here with the command that
# runs it (the placement rule, P5: a golden the workflow does not list is
# a golden nothing runs).
#
# The offline job runs headless on every pull request and on main. The
# Argo ocean heat content golden reads only the committed data root
# under knowledge/references/retrieval/argo-ohc-root and a fixture it
# generates; the SWOT loader golden builds its swath fixture in memory.
# Neither touches a live service, needs a credential or carries a
# secret.
#
# The cache job runs the goldens that read the ECCO fixture cache, the
# 2010 subset (about 2.5 GB under ~/ECCO_V4r4) that
# verification/fixtures/fetch_ecco_2010.py stages through earthaccess
# and ecco_access under an Earthdata Login, then stamped by the
# provider repository's verify tool against the bundle's fixture
# manifest (the attesters refuse a receipt from an unstamped tree).
# It runs only on workflow_dispatch: on a maintainer's machine the
# cache is already present and the fetch step is a no-op; on a hosted
# runner the fetch step stages it from the EARTHDATA_TOKEN secret,
# which is passed to earthaccess through the environment and never
# printed. Without that secret the fetch fails loudly and the job
# documents that the cache must be present.
#
# verification/sea_level_budget.py is the release qualification surface
# (.osp/surfaces.yaml) and runs with the qualification prompts.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Every golden passes on the committed fixtures
        run: uv run verification/argo_ohc.py
      - name: The SWOT loader golden passes on its in-memory swath fixture
        run: uv run verification/load_swot.py
  cache-goldens:
    # The goldens that read the ECCO fixture cache staged by
    # verification/fixtures/fetch_ecco_2010.py; manual only.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: plugin
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: open-science-pillars/nasa-daac-knowledge
          path: nasa-daac-knowledge
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Stage the ECCO 2010 fixture cache (a no-op where it is present)
        # earthaccess reads EARTHDATA_TOKEN from the environment; the
        # token is never echoed, and the step fails loudly without it
        # when the cache is absent.
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: uv run verification/fixtures/fetch_ecco_2010.py
      - name: Stamp the cache against the bundle's fixture manifest
        run: >
          uv run ../nasa-daac-knowledge/tools/science_record_verify.py
          --manifest ../nasa-daac-knowledge/knowledge/podaac/references/retrieval/fixtures-2010-manifest.json
          --data-root ~/ECCO_V4r4 --checksum all --exact --stamp
      - name: The ECCO loader golden passes on the cache
        run: uv run verification/load_ecco.py
      - name: The heat budget golden passes through the sanctioned executor and attester
        env:
          NASA_DAAC_KNOWLEDGE: ${{ github.workspace }}/nasa-daac-knowledge
        run: uv run verification/ocean_budget.py
      - name: The salt budget golden passes on the cache
        run: uv run verification/salt_budget.py
      - name: The transport analysis golden passes on the cache
        run: uv run verification/transport_analysis.py
      - name: The volume budget golden passes on the cache
        run: uv run verification/volume_budget.py
